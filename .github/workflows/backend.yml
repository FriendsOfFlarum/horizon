name: Horizon PHP

on: [workflow_dispatch, push, pull_request]

jobs:
  run:
    uses: flarum/framework/.github/workflows/REUSABLE_backend.yml@im/reusable-backend-redis
    with:
      enable_backend_testing: true
      enable_redis: true
      redis_variant: valkey
      enable_phpstan: true

      backend_directory: .
