fof-horizon:
  admin:
    settings:
      trim_title: Trim Settings
      trim_help: |
        Here you can configure for how long (in minutes) you desire Horizon to
        persist the recent and failed jobs. Typically, recent jobs are kept
        for one hour while all failed jobs are stored for an entire week.
      trim_recent: Trim Recent Jobs
      trim_recent_help: |
        This table is used to display recent jobs in the Horizon dashboard.
      trim_pending: Trim Pending Jobs
      trim_pending_help: |
        This table is used to display pending jobs in the Horizon dashboard.
      trim_completed: Trim Completed Jobs
      trim_completed_help: |
        This table is used to display completed jobs in the Horizon dashboard.
      trim_recent_failed: Trim Recent Failed Jobs
      trim_recent_failed_help: |
        This table is used to display recent failed jobs in the Horizon dashboard.
      trim_failed: Trim Failed Jobs
      trim_failed_help: |
        This table is used to display failed jobs in the Horizon dashboard.
      trim_monitored: Trim Monitored Jobs
      trim_monitored_help: |
        This table is used to display monitored jobs in the Horizon dashboard.

      supervisor_title: Supervisor Settings
      supervisor_help: |
        Configure the Horizon supervisor that runs your queue workers. These
        values can be overridden per deployment via config.php (under the
        "horizon" key) or FOF_HORIZON_* environment variables — values set
        there take precedence over this page. Restart Horizon after changing
        any of these settings.
      supervisor_processes: Worker Processes
      supervisor_processes_help: |
        The maximum number of worker processes the supervisor may run.
      supervisor_memory: Worker Memory Limit (MB)
      supervisor_memory_help: |
        A worker restarts once it exceeds this memory usage.
      supervisor_tries: Job Tries
      supervisor_tries_help: |
        How many times a job is attempted before it is marked as failed.
      supervisor_queues: Queues
      supervisor_queues_help: |
        Comma-separated list of queue names the workers consume. Add any
        queues your extensions dispatch jobs onto.
      supervisor_balance: Balance Strategy
      supervisor_balance_help: |
        How Horizon distributes worker processes across the queues above.
      memory_limit: Master Process Memory Limit (MB)
      memory_limit_help: |
        Memory limit for the Horizon master supervisor process.

    stats:
      queue_heading: Queue
      kv_heading: Key-Value Store
      full_dashboard: Horizon Dashboard
      auto_refresh: Auto Refresh
      refresh: Refresh
      error:
        title: Connection Error
        fetch_failed: Unable to fetch Horizon statistics. Please check your Redis configuration.
        setup_docs: View Redis Setup Documentation
      eviction_pressure: memory pressure
      eviction_policy_tooltip: >-
        The eviction policy is how the store selects what to remove when the
        maxmemory limit is reached. The default is `noeviction`: new values
        aren't saved when the memory limit is reached. Click to view
        documentation.
      eviction_warning: >-
        Memory usage is at {usage}% of maxmemory and the eviction policy is
        "{policy}", so keys — potentially including queue data — may be
        evicted soon. Increase maxmemory or move the queue to a dedicated
        database with more headroom.
      health:
        excellent: Excellent
        good: Good
        poor: Poor
        critical: Critical
        tooltip_heading: "Health score: {score}/100"
        factor:
          status: "Horizon is {value}"
          wait: "Long queue wait: {value}"
          memory: "Redis memory pressure: {value}"
      status:
        running: Running
        paused: Paused
        inactive: Inactive
      period:
        minutes: "past {count} min"
        hour: past hour
        hours: "past {count} hours"
        day: past day
        days: "past {count} days"
      data:
        processes: Worker Processes
        jobs-per-minute: Jobs Per Minute
        pending-jobs: Pending Jobs
        recent-jobs: Jobs
        failed-jobs: Failed Jobs
        max-wait: Max Wait
        slowest-queue: Slowest Queue
        highest-throughput-queue: Busiest Queue
        memory-used: Memory Used
        memory-peak: Memory Peak
        memory-max: Max Memory
        ops-per-sec: Ops Per Second
        connected-clients: Connected Clients
        blocked-clients: Blocked Clients
        eviction-policy: Eviction Policy
